{% extends "base.html" %}

{% block title %}Admin - Create User | AuthNode{% endblock %}

{% block content %}
<div class="w-full max-w-md glass p-10 rounded-[2rem] shadow-2xl relative overflow-hidden border border-white/10">
    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-emerald-500 to-indigo-500"></div>
    
    <div class="mb-10 text-center">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-black uppercase tracking-widest mb-5">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
            Admin Only
        </div>
        <h2 class="text-3xl font-bold text-white mb-2">Create New User</h2>
        <p class="text-slate-400 text-sm">Provision a new operator with admin-set credentials</p>
    </div>
    
    <div id="alert-box" class="hidden mb-8 p-4 rounded-xl text-sm border font-medium"></div>

    <form id="create-user-form" class="space-y-6">
        <div class="space-y-1.5">
            <label for="username" class="block text-xs font-bold uppercase tracking-widest text-slate-400 ml-1">Username</label>
            <input type="text" id="username" name="username" required placeholder="newuser"
                class="input-field w-full rounded-xl px-5 py-3.5 text-white outline-none focus:ring-2 focus:ring-indigo-500/50">
        </div>
        
        <div class="space-y-1.5">
            <label for="email" class="block text-xs font-bold uppercase tracking-widest text-slate-400 ml-1">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="user@example.com"
                class="input-field w-full rounded-xl px-5 py-3.5 text-white outline-none focus:ring-2 focus:ring-indigo-500/50">
        </div>
        
        <div class="space-y-1.5">
            <label for="password" class="block text-xs font-bold uppercase tracking-widest text-slate-400 ml-1">Set Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter password for new user"
                class="input-field w-full rounded-xl px-5 py-3.5 text-white outline-none focus:ring-2 focus:ring-indigo-500/50">
        </div>
        
        <div class="space-y-1.5">
            <label for="role" class="block text-xs font-bold uppercase tracking-widest text-slate-400 ml-1">Role Allocation</label>
            <div class="relative">
                <select id="role" name="role" class="input-field w-full rounded-xl px-5 py-3.5 text-white outline-none focus:ring-2 focus:ring-indigo-500/50 appearance-none cursor-pointer">
                    <option value="user" class="bg-slate-900">Standard User</option>
                    <option value="admin" class="bg-slate-900">System Administrator</option>
                </select>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none opacity-50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
        </div>
        
        <button type="submit" id="submit-btn" class="w-full mt-4 btn-primary text-white font-bold py-4 rounded-xl shadow-indigo-500/20 active:scale-95 transition-all">
            Create User Account
        </button>
    </form>
    
    <div class="mt-10 text-center">
        <a href="/dashboard" class="text-slate-400 hover:text-indigo-400 text-sm font-medium transition-colors">← Back to Dashboard</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    const token = localStorage.getItem('access_token');
    if (!token) {
        window.location.href = '/login';
    }

    document.getElementById('create-user-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const form = e.target;
        const submitBtn = document.getElementById('submit-btn');
        const alertBox = document.getElementById('alert-box');
        
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        submitBtn.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Creating...</span>';
        
        const formData = new FormData(form);
        
        try {
            const response = await fetch('/admin/create-user', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            
            const data = await response.json();
            
            alertBox.classList.remove('hidden');
            if (response.ok) {
                alertBox.className = "mb-8 p-4 rounded-xl text-sm border font-medium bg-emerald-500/10 border-emerald-500/20 text-emerald-400 block";
                alertBox.innerHTML = `✓ ${data.message} (ID: ${data.user_id})`;
                form.reset();
            } else {
                alertBox.className = "mb-8 p-4 rounded-xl text-sm border font-medium bg-rose-500/10 border-rose-500/20 text-rose-400 block";
                alertBox.innerHTML = "Error: " + (data.detail || "Failed to create user.");
            }
        } catch (error) {
            alertBox.classList.remove('hidden');
            alertBox.className = "mb-8 p-4 rounded-xl text-sm border font-medium bg-rose-500/10 border-rose-500/20 text-rose-400 block";
            alertBox.innerHTML = "Connection Error: Could not reach server.";
        }
        
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        submitBtn.innerHTML = 'Create User Account';
    });
</script>
{% endblock %}
